# Keeps rainfall current and lets the alert engine run on its own, without
# anyone opening the dashboard. Every hour this runner asks the backend which
# zones to watch, fetches their rainfall from Open-Meteo, and posts it to the
# backend (POST /rainfall/ingest), which stores it and fires/clears alerts.
#
# Why the runner fetches and not the backend: Open-Meteo rate-limits (HTTP 429)
# the shared outgoing IPs of free hosts like Render, so the backend's own fetch
# was being refused. See scripts/refresh_rainfall_from_runner.py.
# Why GitHub and not a timer inside the backend: the free Render service sleeps
# when idle, so a timer running inside it would sleep too. This job wakes it.
#
# Needs ONE repository secret (Settings -> Secrets and variables -> Actions):
#   OFFICER_API_KEY   the same value as API_KEY on Render (the officer key)
# Until it is set, each run shows a warning and falls back to the public
# refresh-if-stale endpoint (which only works while Open-Meteo allows Render).
name: Refresh rainfall

on:
  schedule:
    # Hourly, at :17 (GitHub queues jobs scheduled exactly on the hour and can
    # delay them by many minutes).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      alerts:
        description: "Trigger alerts/SMS for zones over their threshold (false = store rainfall only)"
        type: boolean
        default: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/refresh_rainfall_from_runner.py
          sparse-checkout-cone-mode: false
      - name: Fetch rainfall and send it to the backend
        env:
          OFFICER_KEY: ${{ secrets.OFFICER_API_KEY }}
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://landslide-ews-backend.onrender.com' }}
          # format() makes it a string: 'cond && false || x' would wrongly fall through to x,
          # because a boolean false is falsy in GitHub's expression language but the string 'false' is not.
          ALERTS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.alerts) || 'true' }}
        run: |
          if [ -z "$OFFICER_KEY" ]; then
            # Not silent: this shows as a yellow warning on the run.
            echo "::warning::OFFICER_API_KEY secret is not visible to this repository -- using the public refresh-if-stale endpoint instead."
            curl --fail-with-body --silent --show-error               --max-time 200 --retry 3 --retry-delay 30 --retry-all-errors               -X POST "$BACKEND_URL/rainfall/refresh-if-stale"
            echo
            exit 0
          fi
          if [ "$ALERTS" = "false" ]; then FLAG="--no-alerts"; else FLAG=""; fi
          python3 scripts/refresh_rainfall_from_runner.py $FLAG
